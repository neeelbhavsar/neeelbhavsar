name: Generate Profile Metrics

# No "push" trigger on purpose: this workflow commits SVGs back into the repo,
# and a PAT-authored commit WOULD retrigger a push workflow, causing an infinite loop.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # ---------------------------------------------------------------
      # LANGUAGES — the only card the README now consumes.
      # Stats / Achievements / Isocalendar steps removed: their cards surfaced
      # zero-value activity counters, and the achievements plugin is broken
      # upstream (it scrapes GitHub search totals that GitHub has hidden).
      # ---------------------------------------------------------------
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: neeelbhavsar
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_timezone: Asia/Kolkata
          extras_css: |
            :root {
              --color-fg-default: #E7E0D6;
              --color-fg-muted: #A8A29E;
              --color-canvas-default: #1C1917;
              --color-canvas-subtle: #1C1917;
              --color-border-default: #3F3A36;
              --color-accent-fg: #C2703D;
            }
            h2, .title { color: #C2703D !important; }
            /* Metrics writes calendar cells as hardcoded fill attributes, not
               CSS variables, so the :root ramp above never reaches them.
               These override GitHub's green defaults with the copper ramp. */
            [fill="#ebedf0"] { fill: #2A2422 !important; }
            [fill="#9be9a8"] { fill: #5C3A22 !important; }
            [fill="#40c463"] { fill: #8C4A24 !important; }
            [fill="#30a14e"] { fill: #C2703D !important; }
            [fill="#216e39"] { fill: #E39A6B !important; }
            svg { background: #1C1917 !important; }

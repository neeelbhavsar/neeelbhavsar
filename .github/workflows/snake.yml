name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: neeelbhavsar
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C2703D&color_dots=%231C1917,%233F3A36,%238C4A24,%23C2703D,%23E7E0D6
            dist/github-snake.svg?color_snake=%23C2703D&color_dots=%23E7E0D6,%23C2703D,%238C4A24,%233F3A36,%231C1917

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}